version: 2

models:
  - name: stg_orders
    description: Healed orders, quarantined rows excluded.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: currency
        tests:
          - accepted_values:
              values: ["INR", "USD", "EUR"]

  - name: fct_daily_revenue
    description: Daily revenue by currency.
    columns:
      - name: order_date
        tests:
          - not_null
